nginx_vhosts:

  - name: fuelman

    server_names:
      - fuelman.in
      - www.fuelman.in

    primary_domain: fuelman.in
    # indivial ssl disabled, since it is moved to global ssl termination at nginx level.. enable if global nginx ssl termination is disableds
    # cert_name: fuelman.in

    nginx_locations:
      - path: /
        proxy_pass: http://fuelman-ui-prod:80

      - path: /api
        proxy_pass: http://fuelmanAppProd:8080

  
  - name: fleet

    server_names:
      - fleet.fuelman.in

    primary_domain: fleet.fuelman.in
    # indivial ssl disabled, since it is moved to global ssl termination at nginx level.., enable if global nginx ssl termination is disableds
    # cert_name: fleet.fuelman.in

    nginx_locations:
      - path: /
        proxy_pass: http://fleet-ui-prod:80

  - name: anchor

    server_names:
      - anchor.fuelman.in

    primary_domain: anchor.fuelman.in
    # indivial ssl disabled, since it is moved to global ssl termination at nginx level.., enable if global nginx ssl termination is disableds
    #cert_name: anchor.fuelman.in

    nginx_locations:
      - path: /
        proxy_pass: http://prod-anchor-ui:80

      - path: /api
        proxy_pass: http://prod-anchor-app:9080

# nginx global port configuration
nginx_http_port : '81'

# disabled since ssl handshake happen at global level and then nginx will route to the correct vhost based on server_name
# nginx_https_port : '8443'