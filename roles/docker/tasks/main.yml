# -------------------------
# Remove conflicting packages
# -------------------------
- name: Remove old Docker / containerd packages
  apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - containerd
      - containerd.io
    state: absent
    purge: yes

# -------------------------
# Install dependencies
# -------------------------
- name: Install required packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

# -------------------------
# Setup keyrings directory
# -------------------------
- name: Ensure keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# -------------------------
# Add Docker GPG key
# -------------------------
- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /tmp/docker.gpg
    mode: '0644'

- name: Convert GPG key (idempotent)
  command: >
    gpg --dearmor --yes
    -o /etc/apt/keyrings/docker.gpg
    /tmp/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

# -------------------------
# Add Docker repository
# -------------------------
- name: Add Docker repository
  apt_repository:
    repo: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

# -------------------------
# Install Docker Engine
# -------------------------
- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

# -------------------------
# Ensure Docker service
# -------------------------
- name: Ensure Docker is running
  service:
    name: docker
    state: started
    enabled: yes

# -------------------------
# Create application network
# -------------------------
- name: Ensure {{docker_network}} network exists
  community.docker.docker_network:
    name: "{{docker_network}}"
    state: present

#-------------------------
# Get Docker bridge gateway
#-------------------------

- name: Get Docker bridge gateway
  ansible.builtin.command:
    cmd: docker network inspect bridge -f '{{ "{{range .IPAM.Config}}{{.Gateway}}{{end}}" }}'
  register: docker_bridge_gateway
  changed_when: false

#-------------------------
# Set Docker host gateway
#-------------------------
- name: Set Docker host gateway
  ansible.builtin.set_fact:
    docker_host_ip: "{{ docker_bridge_gateway.stdout }}"