- name: Run PostgreSQL container
  community.docker.docker_container:
    name: "{{ postgres_container_name }}"
    image: "{{ postgres_image }}"
    state: started
    restart_policy: always

    networks:
      - name: "{{ postgres_network }}"

    ports:
      - "{{ postgres_port }}:5432"

    volumes:
      - "{{ postgres_data_dir }}:/var/lib/postgresql/data"
      - "{{ postgres_cert_dir }}:/var/lib/postgresql/certs"
      - "{{ postgres_config_dir }}:/etc/postgresql/{{env}}"
    command: >
      postgres
      -c config_file=/etc/postgresql/{{env}}/postgresql.conf

    env:
      POSTGRES_DB: "{{ postgres_db }}"
      POSTGRES_USER: "{{ postgres_user }}"
      POSTGRES_PASSWORD: "{{ postgres_password }}"

# -------------------------
# Wait for PostgreSQL
# -------------------------
- name: Wait for PostgreSQL to become ready
  command:
    argv:
      - docker
      - exec
      - "{{ postgres_container_name }}"
      - pg_isready
      - -h
      - "127.0.0.1"
      - -U
      - "{{ postgres_user }}"
  register: pg_ready
  retries: 20
  delay: 3
  until: pg_ready.rc == 0
  changed_when: false
