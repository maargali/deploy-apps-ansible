- name: Copy backend Dockerfile
  template:
    src: Dockerfile.j2
    dest: "{{ backend_app_dir }}/Dockerfile"

- name: Copy .dockerignore
  template:
    src: dockerignore.j2
    dest: "{{ backend_app_dir }}/.dockerignore"

- name: Build backend Docker image (Debug)
  ansible.builtin.shell: |
    docker build \
      --no-cache \
      --progress=plain \
      --build-arg JAR_FILE={{ app_jar_file }} \
      -t {{ backend_image_name }} \
      . 2>&1 | tee /tmp/docker-build.log
  args:
    chdir: "{{ backend_app_dir }}"
  when: docker_debug | default(false)

- name: Build backend Docker image
  community.docker.docker_image:
    name: "{{ backend_image_name }}"
    source: build
    build:
      path: "{{ backend_app_dir }}"
      args:
        JAR_FILE: "{{ app_jar_file }}"
  when: not (docker_debug | default(false))

- name: Run backend container
  community.docker.docker_container:
    name: "{{ backend_container_name }}"
    image: "{{ backend_image_name }}"

    state: started
    restart_policy: always
    recreate: true

    networks:
      - name: "{{ backend_network }}"

    ports:
      - "{{ backend_host_port }}:{{backend_container_port}}"

    env:
      TZ: Asia/Kolkata

      JAVA_OPTS: "{{ backend_java_opts }}" 
