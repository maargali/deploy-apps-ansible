- name: Run nginx reverse proxy container
  community.docker.docker_container:

    name: nginx-proxy

    image: nginx:alpine

    state: started
    restart_policy: always
    recreate: true

    ports:
      - "80:80"
      - "443:443"

    networks:
      - name: "{{ docker_network }}"

    volumes:
      - "{{app_base_dir}}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
