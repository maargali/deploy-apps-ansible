---
- name: Install certbot
  ansible.builtin.apt:
    name: certbot
    state: present
    update_cache: true

- name: Generate or update SSL certificates
  block:

    - name: Stop global-nginx
      community.docker.docker_container:
        name: global-nginx
        state: stopped

    - name: Generate or update SSL certificates
      ansible.builtin.command: >
        certbot certonly
        --standalone
        --non-interactive
        --agree-tos
        --expand
        --cert-name {{ certbot_cert_name }}
        --email {{ certbot_email }}
        {% for domain in certbot_domains %}
        -d {{ domain }}
        {% endfor %}

  always:

    - name: Start global-nginx
      community.docker.docker_container:
        name: global-nginx
        state: started